name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # torch is installed from the CPU index rather than cu128. CI only
      # needs the package to import; the GPU-specific wheel is a local
      # concern and pulling 2.7 GB here would make every run minutes long.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      # `ruff format --check` is deliberately not run. The codebase is
      # hand-wrapped at a narrower width than the formatter produces, and
      # `ruff format` would rewrite 41 of 65 files -- a diff that touches
      # almost every line of the project, destroys `git blame` on all of
      # it, and catches no defects. `ruff check` is the part that finds
      # real problems: E, F, I, UP and B, so unused imports, undefined
      # names, unsorted imports and the bugbear rules. Those are enforced.
      #
      # If the project ever wants formatter-enforced style, the way to get
      # there is one commit that reformats everything and nothing else, not
      # a CI gate that fails on arrival.

      # These tests deliberately avoid loading the MuJoCo scene or any
      # dataset, so they run without a GPU, without the generated model,
      # and without the tens of gigabytes of recorded episodes. They guard
      # cross-module invariants whose violation is silent rather than
      # testing individual functions.
      - name: Invariant tests
        run: pytest -v

      # Catches syntax errors and bad imports in scripts the tests do not
      # exercise. Import failure is a real class of breakage after a
      # refactor and it costs seconds to check.
      - name: Import check
        run: |
          python -c "import src.config"
          python -c "import src.data.task"